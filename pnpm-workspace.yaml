packages:
  - apps/*
  - packages/*
allowBuilds:
  "@nestjs/core": true
  "@prisma/client": true
  "@prisma/engines": true
  bcrypt: true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true
# Security floors for transitive dependencies (audit/04-security.md S-17):
# lodash via @nestjs/config (_.template code injection), qs via express
# (query-string parsing, remotely reachable), js-yaml via @nestjs/swagger.
# Phase 10 (pnpm audit in CI): multer via @nestjs/platform-express (six DoS
# advisories; no upload routes today, but the parser is mounted by Express),
# postcss via next (source-map path traversal, build time).
overrides:
  lodash: ^4.18.1
  qs: ^6.16.0
  js-yaml: ^4.3.2
  multer: ^2.3.0
  postcss: ^8.5.18
