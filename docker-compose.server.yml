# Production stack for this server.
# Differs from docker-compose.prod.yml in two ways:
#   - api is published on host 3002 (3001 is taken by aradobot-web under pm2)
#   - an nginx proxy on :80 serves the web app and routes /api/ to the api,
#     which is what NEXT_PUBLIC_API_URL / NEXT_PUBLIC_SITE_URL in .env expect
version: "3.9"

services:
  postgres:
    image: docker.io/pgvector/pgvector:pg16
    container_name: pricelens-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: pricelens-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: docker.io/getmeili/meilisearch:v1.6
    container_name: pricelens-meilisearch
    restart: always
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
    volumes:
      - meili_data:/meili_data
    networks:
      - internal

  api:
    image: localhost/pricelens_api:latest
    container_name: pricelens-api
    restart: always
    env_file: .env
    ports:
      - "3002:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - external
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    image: localhost/pricelens_web:latest
    container_name: pricelens-web
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      # Server-side rendering runs inside the container, where the public
      # host is not routable — reach the API directly over the compose network.
      API_INTERNAL_URL: http://api:3001/api/v1
    networks:
      - external
    depends_on:
      - api

  proxy:
    image: docker.io/library/nginx:1.27-alpine
    container_name: pricelens-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro,z
    networks:
      - external
    depends_on:
      - web
      - api

volumes:
  postgres_data:
  redis_data:
  meili_data:

networks:
  internal:
    driver: bridge
  external:
    driver: bridge
