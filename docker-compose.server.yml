# Production stack for this server.
# Differs from docker-compose.prod.yml in two ways:
#   - api is published on host 127.0.0.1:3002 only (3001 is taken by aradobot-web
#     under pm2; nginx is the public way in, S-15)
#   - an nginx proxy on :80 serves the web app and routes /api/ to the api,
#     which is what NEXT_PUBLIC_API_URL / NEXT_PUBLIC_SITE_URL in .env expect
version: "3.9"

services:
  postgres:
    image: docker.io/pgvector/pgvector:pg16
    container_name: pricelens-postgres
    restart: always
    # The default 64 MB /dev/shm ran out under concurrent searches ("could not
    # resize shared memory segment", 2026-10-10). Applies when the container is
    # next recreated; until then max_parallel_workers_per_gather=0 (ALTER SYSTEM)
    # keeps queries out of shared memory.
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: pricelens-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Meilisearch was removed (ADR 0003): nothing queried it. The container that
  # may still be running from before is no longer part of this stack; stopping
  # it and deleting its volume is an owner decision (audit 01, D-8).

  api:
    image: localhost/pricelens_api:latest
    container_name: pricelens-api
    restart: always
    env_file: .env
    environment:
      # HTTP only: jobs are enqueued here and run in the worker (ADR 0004, D-9).
      PROCESS_ROLE: api
      # One JSON object per log line (OPS-16).
      LOG_FORMAT: json
    ports:
      - "127.0.0.1:3002:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - external
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # The same image in the worker role: Bull processors, schedulers and the
  # scraping browsers (ADR 0004, D-9). An out-of-memory crash here no longer
  # takes the API down with it. It listens on 3001 only for its health check;
  # nothing routes to it. deploy-api.sh applies migrations, not this container.
  worker:
    image: localhost/pricelens_api:latest
    container_name: pricelens-worker
    restart: always
    env_file: .env
    environment:
      PROCESS_ROLE: worker
      LOG_FORMAT: json
      RUN_MIGRATIONS_ON_START: "false"
      # Recycle before the heap limit (~2 GB) and keep one heap snapshot of
      # the leak for diagnosis: podman cp pricelens-worker:/tmp/heap . (OPS-01)
      WORKER_MAX_HEAP_MB: "1200"
      WORKER_HEAP_SNAPSHOT_DIR: /tmp/heap
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Browser profiles hold the one-time CAPTCHA solves and bot-wall clearance
    # cookies the scrapers depend on. Inside the image they were wiped on every
    # deploy, silently re-blocking Alibaba/Amazon until someone re-solved them.
    volumes:
      - browser_profiles:/repo/apps/api/.browser-profiles
    # noVNC into the scrapers' own browser window, to solve a store CAPTCHA
    # (e.g. Alibaba) in the live profile. Loopback only -- reach it through an
    # SSH tunnel (ssh -L 6081:127.0.0.1:6081 pricelens). Nothing listens
    # unless ENABLE_NOVNC=true and VNC_PASSWORD are set (entrypoint.api.sh).
    ports:
      - "127.0.0.1:6081:6080"
    networks:
      - internal
      - external
    # Give the current store call a moment to end; an unfinished Bull job is
    # picked up again once its lock expires.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    image: localhost/pricelens_web:latest
    container_name: pricelens-web
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      # Server-side rendering runs inside the container, where the public
      # host is not routable — reach the API directly over the compose network.
      API_INTERNAL_URL: http://api:3001/api/v1
    networks:
      - external
    depends_on:
      - api

  proxy:
    # nginx 1.27.5 plus the Brotli modules (docker/Dockerfile.proxy).
    image: localhost/pricelens_proxy:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.proxy
    container_name: pricelens-proxy
    restart: always
    # The host's network namespace (D-31): rootless port forwarding into a
    # podman network hid every visitor behind one address (10.89.1.7), so the
    # API's per-IP rate limits and records saw one client for the whole site.
    # Here nginx binds 80/443 itself (net.ipv4.ip_unprivileged_port_start=80
    # on this host) and sees the real peer. Upstreams are fixed loopback ports:
    # the API 127.0.0.1:3002, the web colours 127.0.0.1:3010/3011
    # (deploy-web.sh), SLI 127.0.0.1:3020. Container names do not resolve here.
    network_mode: host
    volumes:
      - ./docker/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro,z
      # Generated at deploy time, never tracked. Mounted as a DIRECTORY so
      # rewriting the file inside it cannot detach the mount the way replacing
      # a single bind-mounted file does.
      - ./docker/nginx-upstreams:/etc/nginx/conf.d/upstreams:ro,z
      # Shared with certbot: the challenge webroot, and the certificates it
      # writes. Renewal is therefore a reload, never a restart.
      - ./docker/certbot/www:/var/www/certbot:ro,z
      - ./docker/certbot/conf:/etc/letsencrypt:ro,z
    depends_on:
      - web
      - api

volumes:
  postgres_data:
  browser_profiles:
  redis_data:

networks:
  internal:
    driver: bridge
  external:
    driver: bridge
