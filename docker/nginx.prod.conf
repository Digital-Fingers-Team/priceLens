# The live web upstream address, written by scripts/deploy-web.sh into an
# untracked file (see docker/nginx-upstreams/README.md).
#
# The include is explicit because nginx expands conf.d/*.conf from the image
# entrypoint and that glob is NOT recursive -- without this line the upstream
# block in the subdirectory is never parsed and nginx refuses to start with
# "host not found in upstream".
include /etc/nginx/conf.d/upstreams/*.conf;

# The affiliate conversion postback authenticates with ?secret=... (audit 04
# handoff). The default access log would record it in full, so this site logs
# the URI with that value replaced. Same field positions as "combined"
# (scripts/monitor.sh reads the status from field 9).
map $request_uri $pricelens_log_uri {
    "~^(?<pl_pre>.*[?&]secret=)[^&]*(?<pl_post>.*)$" "${pl_pre}REDACTED${pl_post}";
    default $request_uri;
}
log_format pricelens_redacted '$remote_addr - $remote_user [$time_local] '
                              '"$request_method $pricelens_log_uri $server_protocol" $status $body_bytes_sent '
                              '"$http_referer" "$http_user_agent"';

# Port 80 exists to answer ACME and to send everyone to TLS. It is deliberately
# not a second way to reach the app.
server {
    listen 80;
    server_name pricelens.store www.pricelens.store pricelens.work.gd www.pricelens.work.gd;

    # Must stay on :80 -- http-01 is validated over plain HTTP, so redirecting
    # this path would break every renewal.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Anything arriving on the bare IP or an unknown name. Closing the connection
# rather than serving the site keeps the app on one canonical origin, which is
# what NEXT_PUBLIC_SITE_URL and the cookies assume.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl;
    http2 on;

    access_log /var/log/nginx/access.log pricelens_redacted;
    server_name pricelens.work.gd www.pricelens.work.gd;

    ssl_certificate     /etc/letsencrypt/live/pricelens.work.gd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pricelens.work.gd/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Six months, and only once the certificate is known to work. A browser
    # that has seen this header will refuse plain HTTP for that long, so it is
    # not something to turn on and then reconsider.
    add_header Strict-Transport-Security "max-age=15768000" always;

    client_max_body_size 25m;

    # Compression happens here, not in the apps (audit 08 P-15): Brotli where
    # the browser accepts it (the image is docker/Dockerfile.proxy), gzip
    # otherwise. The upstreams are asked for identity (Accept-Encoding "" in
    # each location) so nginx receives something it can compress.
    brotli            on;
    brotli_comp_level 5;
    brotli_min_length 1024;
    brotli_types      text/plain text/css text/xml application/javascript application/json
                      application/xml application/rss+xml image/svg+xml text/x-component;
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/xml application/javascript application/json
                      application/xml application/rss+xml image/svg+xml text/x-component;

    location /api/ {
        # The API's published loopback port. The proxy runs in the host's
        # network namespace (D-31), where the name "api" does not resolve; a
        # fixed port also never goes stale when the container restarts.
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding   "";
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
    }

    location / {
        # The address behind this name lives in docker/nginx-upstreams/web.conf,
        # which is generated by scripts/deploy-web.sh and is NOT tracked in git.
        #
        # It used to be a literal address written into this file. That made a
        # tracked file a runtime-mutable one, and any git operation on the
        # deploy checkout -- a reset, a checkout, a pull -- both reverted the
        # address and replaced the file by rename, which silently detaches the
        # proxy's single-file bind mount. Both failure modes took the site down.
        proxy_pass http://pricelens_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding   "";
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
    }
}

# TLS on the bare IP: the certificate does not cover it, so a browser would
# show a name-mismatch warning whatever we serve. Close instead.
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate     /etc/letsencrypt/live/pricelens.work.gd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pricelens.work.gd/privkey.pem;
    return 444;
}
