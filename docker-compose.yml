# Local development infrastructure only (Postgres + pgvector, Redis).
#
# The explicit project name keeps this stack's containers and volumes apart
# from production. Without it, compose derives the project from the directory
# name ("pricelens") -- the same project the production stack uses on the
# server -- so `down -v` here would delete production's volumes.
#
# Ports are bound to 127.0.0.1: these services use well-known dev passwords
# and must never be reachable from outside the machine.
name: pricelens-dev

services:
  postgres:
    image: docker.io/pgvector/pgvector:pg16
    container_name: pricelens-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pricelens
      POSTGRES_PASSWORD: pricelens_dev_password
      POSTGRES_DB: pricelens_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricelens -d pricelens_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: pricelens-dev-redis
    restart: unless-stopped
    command: redis-server --requirepass pricelens_redis_dev --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "pricelens_redis_dev", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
